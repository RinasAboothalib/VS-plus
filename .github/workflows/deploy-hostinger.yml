# Builds the site and uploads it to Hostinger (visualstudiosplus.com) on every
# push to main, so the domain stays in step with GitHub (Vercel deploys itself).
#
# One-time setup, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (from hPanel → Files → FTP Accounts)
#   Optional variables:
#     FTP_SERVER_DIR — the site's folder as seen from the FTP login; found automatically
#                      when not set ("domains/visualstudiosplus.com/public_html/" when the
#                      login opens at the account root, else "public_html/")
#     FTP_PROTOCOL   — "ftps" (default, encrypted) or "ftp" if the host refuses TLS
#
# Only changed files are uploaded after the first run; the action keeps a small
# .ftp-deploy-sync-state.json on the server to know what is already there. The last
# step checks the live site really serves this build, so a wrong folder fails loudly.

name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Find the site's folder as the FTP login sees it, and log what is there. Hostinger's
      # FTP certificate is issued for *.hstgr.io, so connect to the server's IP but check the
      # certificate against that name: TLS stays fully verified for this listing.
      - name: Find the website folder
        id: dir
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          FIXED: ${{ vars.FTP_SERVER_DIR }}
        run: |
          ip="${S#ftp://}"; ip="${ip%%/*}"; ip="${ip//[[:space:]]/}"
          ls_ftp() { curl -sS --max-time 30 --ssl-reqd --connect-to "ftp.hstgr.io:21:$ip:21" --user "$U:$P" --list-only "ftp://ftp.hstgr.io/$1"; }
          root=$(ls_ftp "" | tr -d '\r') || { echo "::error::Could not list the FTP login folder."; exit 1; }
          seen=$(echo "$root" | tr -s '\n' ' ')
          if [ -n "$FIXED" ]; then dir="$FIXED"
          elif ls_ftp "domains/visualstudiosplus.com/public_html/" > /dev/null 2>&1; then dir="domains/visualstudiosplus.com/public_html/"
          elif echo "$root" | grep -qx 'public_html' && echo "$root" | grep -qx 'DO_NOT_UPLOAD_HERE'; then dir="public_html/"
          else echo "::error::No site folder found. The FTP login shows: $seen"; exit 1; fi
          echo "::notice::FTP login shows: $seen | uploading to: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Hostinger's FTP server sometimes drops the connection mid-upload (ECONNRESET);
      # try up to three times, pausing between tries.
      - name: Upload to Hostinger
        id: up1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.dir.outputs.dir }}

      - name: Wait before retrying
        if: steps.up1.outcome == 'failure'
        run: sleep 30

      - name: Upload to Hostinger (second try)
        id: up2
        if: steps.up1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.dir.outputs.dir }}

      - name: Wait before the last try
        if: steps.up1.outcome == 'failure' && steps.up2.outcome == 'failure'
        run: sleep 60

      - name: Upload to Hostinger (last try)
        if: steps.up1.outcome == 'failure' && steps.up2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.dir.outputs.dir }}

      - name: Check the live site serves this build
        run: |
          want=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html)
          for i in 1 2 3 4 5 6; do
            got=$(curl -s --max-time 20 "https://visualstudiosplus.com/?deploy=${GITHUB_RUN_ID}-$i" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' || true)
            [ "$got" = "$want" ] && { echo "Live site serves $want"; exit 0; }
            sleep 10
          done
          echo "::error::Upload finished, but visualstudiosplus.com still serves ${got:-nothing} instead of $want. The files went to a folder the site is not served from: check FTP_SERVER_DIR."
          exit 1
