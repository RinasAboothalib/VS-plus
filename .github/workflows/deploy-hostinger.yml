# Builds the site on every push to main and publishes the finished files to the
# "hostinger" branch. Hostinger's Git deployment (hPanel → Websites → Manage →
# Advanced → GIT, auto-deployment on) pulls that branch into public_html, so
# visualstudiosplus.com updates on its own. Vercel deploys main by itself.
#
# (FTP was dropped: Hostinger's FTP server wrote this account to different storage
# than the website serves. Git deployment writes through the website's own files.)

name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The branch keeps its history (one commit per build), so Hostinger can pull it
      # as a normal fast-forward each time.
      - name: Publish the build to the hostinger branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" hostinger > /dev/null; then
            git clone -q --depth 1 --branch hostinger "$url" site
          else
            mkdir site && git -C site init -q -b hostinger && git -C site remote add origin "$url"
          fi
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Build unchanged; nothing to publish."; exit 0; fi
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -q origin hostinger
          echo "::notice::Published build of ${GITHUB_SHA::7} to the hostinger branch."

      # Hostinger deploys on its own once the branch updates; report (without failing)
      # whether the live site picked the new build up within a few minutes.
      - name: Check the live site
        run: |
          want=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html)
          for i in $(seq 1 18); do
            got=$(curl -s --max-time 20 "https://visualstudiosplus.com/?deploy=${GITHUB_RUN_ID}-$i" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' || true)
            [ "$got" = "$want" ] && { echo "::notice::visualstudiosplus.com serves $want"; exit 0; }
            sleep 10
          done
          echo "::warning::visualstudiosplus.com still serves ${got:-nothing} instead of $want after 3 minutes. Check hPanel → Advanced → GIT (auto-deployment on, branch hostinger)."
